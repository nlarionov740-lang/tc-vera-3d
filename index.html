<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ТЦ «Вера» в 3D</title>
<style>
  :root { --sky-top: #8fbde6; --sky-bottom: #e6f0f7; --btn: rgba(255,255,255,0.72); --btn-text: #1d2328;
          --btn-on: rgba(92,52,30,0.88); --btn-on-text: #fff; --line: rgba(0,0,0,0.10); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(var(--sky-top), var(--sky-bottom));
    font: 14px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--btn-text);
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .bar { position: fixed; display: flex; gap: 6px; z-index: 2; }
  #views { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); }
  #tools { right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); flex-direction: column; align-items: flex-end; }
  button { min-height: 42px; min-width: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 21px;
    background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 500; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 4px rgba(0,0,0,0.12); white-space: nowrap; }
  button.on { background: var(--btn-on); color: var(--btn-on-text); border-color: transparent; }
  @media (max-width: 380px) { button { padding: 0 10px; font-size: 13px; } }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top)); z-index: 2;
    padding: 8px 14px; border-radius: 18px; background: rgba(255,255,255,0.78); color: var(--btn-text); font-size: 13px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  #hint.off { opacity: 0; }
  @media (max-width: 900px) { #hint { display: none; } }
  #msg { position: fixed; top: 46%; left: 0; right: 0; text-align: center; color: #3c4650; padding: 0 16px; font-size: 15px; }
</style>
</head>
<body>
<canvas id="c" aria-label="3D-модель ТЦ «Вера», г. Верещагино, ул. Фрунзе, з/у 80"></canvas>
<div id="msg">Загружаю модель…</div>
<div class="bar" id="tools">
  <button id="tRoof" aria-pressed="false">Без кровли</button>
  <button id="tFound" aria-pressed="false">Фундамент</button>
  <button id="tMove" class="on" aria-pressed="true">Движение</button>
  <button id="tNight" aria-pressed="false">Ночь</button>
</div>
<div class="bar" id="views">
  <button data-view="front">Спереди</button>
  <button data-view="back">Сзади</button>
  <button data-view="top">Сверху</button>
  <button data-view="iso" class="on">3/4</button>
  <button data-view="area">Округа</button>
</div>
